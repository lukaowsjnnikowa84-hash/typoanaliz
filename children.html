<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>ТипоАнализ — Детский анализ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <a href="index.html" class="logo-link">
        <img
          src="generator/resources/logo.png"
          alt="Логотип ТипоАнализ"
          class="logo"
        />
      </a>
      <h1 class="site-title">Детский типоанализ</h1>
    </header>

    <div class="container">
      <h2>Определение типа ребёнка</h2>

      <input type="date" id="child_birthdate" />
      <input
        type="text"
        id="child_name"
        placeholder="Имя ребёнка (необязательно)"
      />
      <select id="child_gender">
        <option value="">Пол ребёнка (необязательно)</option>
        <option value="boy">Мальчик</option>
        <option value="girl">Девочка</option>
      </select>

      <button onclick="calculateChildrenType()">Определить тип</button>

      <div class="divider"></div>

      <h3>Выбрать тип вручную</h3>

      <div
        style="
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          justify-content: center;
        "
      >
        <button class="child-button" onclick="showChildType(1)">Тип 1</button>
        <button class="child-button" onclick="showChildType(2)">Тип 2</button>
        <button class="child-button" onclick="showChildType(3)">Тип 3</button>
        <button class="child-button" onclick="showChildType(4)">Тип 4</button>
        <button class="child-button" onclick="showChildType(5)">Тип 5</button>
        <button class="child-button" onclick="showChildType(6)">Тип 6</button>
        <button class="child-button" onclick="showChildType(7)">Тип 7</button>
        <button class="child-button" onclick="showChildType(8)">Тип 8</button>
        <button class="child-button" onclick="showChildType(9)">Тип 9</button>
        <button class="child-button" onclick="showChildType(10)">Тип 10</button>
        <button class="child-button" onclick="showChildType(11)">Тип 11</button>
        <button class="child-button" onclick="showChildType(12)">Тип 12</button>
      </div>

      <div id="child_result"></div>
    </div>
  </body>
</html>
