<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>ТипоАнализ — Взрослый анализ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <a href="index.html" class="logo-link">
        <img
          src="generator/resources/logo.png"
          alt="Логотип ТипоАнализ"
          class="logo"
        />
      </a>
      <h1 class="site-title">Взрослый типоанализ</h1>
    </header>

    <div class="container">
      <h2>Определение типа</h2>

      <input type="date" id="birthdate" />
      <button onclick="calculateType()">Определить тип</button>

      <div id="adult_result"></div>

      <div class="divider"></div>

      <h2>Совместимость типов</h2>

      <input type="date" id="birthdate1" />
      <input type="date" id="birthdate2" />
      <button onclick="calculateCompatibility()">
        Рассчитать совместимость
      </button>

      <div id="compat_result"></div>

      <div class="divider"></div>

      <h2>Идеальный партнёр</h2>

      <input type="date" id="birthdate_partner" />
      <button onclick="calculateIdealPartner()">
        Показать идеального партнёра
      </button>

      <div id="partner_result"></div>
    </div>
  </body>
</html>
